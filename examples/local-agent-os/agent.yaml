apiVersion: agent.hazeljs.dev/v1alpha1
kind: AgentDefinition
metadata:
  name: support_desk
spec:
  dna:
    format: hazeljs.agent.dna
    version: "1.0.0"
    name: support_desk
    description: Local support agent — lookup orders, refund with Gatekeeper/HITL
    systemPrompt: |
      You are a support desk agent. Use lookup_order for reads.
      Use refund only when the customer clearly asks for a refund.
    tools:
      - name: lookup_order
        description: Look up an order by id (read)
      - name: refund
        description: Issue a refund (requires approval)
        requiresApproval: true
    schedule:
      kind: manual
    env:
      SUPPORT_MODE: local
      # Set with: hazel secret set STRIPE_KEY '…'  then uncomment:
      # STRIPE_KEY: { secret: STRIPE_KEY }
