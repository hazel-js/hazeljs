# Publishes @hazeljs/* packages via npm Trusted Publisher (OIDC).
# Configure on npmjs.com: @hazeljs org → Trusted Publishers →
#   Repository: hazel-js/hazeljs
#   Workflow: publish.yml
#   Environment: prod
# Do not set NPM_TOKEN — OIDC short-lived tokens are used instead.

name: Publish Package to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.0.0)'
        required: true
      skip_git_updates:
        description: 'Skip version bump and git commits (use for publish retries)'
        type: boolean
        default: true
      packages_only:
        description: 'Optional comma-separated names to publish (e.g. saga,queue,graphql). Empty = all remaining.'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"

      - name: Determine release tag
        id: release-tag
        run: |
          if [[ "${{ steps.version.outputs.version }}" == *"beta"* ]] || [[ "${{ steps.version.outputs.version }}" == *"alpha"* ]] || [[ "${{ steps.version.outputs.version }}" == *"rc"* ]]; then
            if [[ "${{ steps.version.outputs.version }}" == *"beta"* ]]; then
              echo "tag=beta" >> $GITHUB_OUTPUT
            elif [[ "${{ steps.version.outputs.version }}" == *"alpha"* ]]; then
              echo "tag=alpha" >> $GITHUB_OUTPUT
            else
              echo "tag=rc" >> $GITHUB_OUTPUT
            fi
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi
          echo "Release tag: $(cat $GITHUB_OUTPUT | grep tag= | cut -d'=' -f2)"

      - name: Checkout default branch and update versions
        if: github.event_name == 'push' || github.event.inputs.skip_git_updates != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | awk '{print $NF}')
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT

          git checkout "$DEFAULT_BRANCH"

          echo "Updating all package.json files to version: $VERSION"
          node scripts/bump-version.js "$VERSION"
          # Keep release commits Prettier-clean (JSON.stringify formatting drift)
          npx prettier --write lerna.json package.json "packages/*/package.json" "packages/*/*/package.json" 2>/dev/null || true

          echo "Version update complete. Updated files:"
          git diff --name-only
        id: checkout

      - name: Install dependencies
        run: npm ci

      - name: Build packages in dependency order
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Commit generated files (cli-manifest, inspector ui-dist)
        if: github.event_name == 'push' || github.event.inputs.skip_git_updates != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/cli-manifest.json 2>/dev/null || true
          git add -A packages/inspector/ui-dist 2>/dev/null || true
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No generated files to commit"
          else
            git commit -m "chore: sync generated build artifacts"
            git pull --rebase --autostash origin "${{ steps.checkout.outputs.default_branch }}"
            git push origin "${{ steps.checkout.outputs.default_branch }}"
          fi

      - name: Commit and push version updates
        if: github.event_name == 'push' || github.event.inputs.skip_git_updates != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json lerna.json packages/*/package.json packages/*/*/package.json 2>/dev/null || true
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No version files to commit"
          else
            git commit -m "chore(release): bump versions to ${{ steps.version.outputs.version }}"
            git pull --rebase --autostash origin "${{ steps.checkout.outputs.default_branch }}"
            git push origin "${{ steps.checkout.outputs.default_branch }}"
          fi

      - name: Configure npm for Trusted Publisher (OIDC)
        run: |
          set -euo pipefail
          npm install -g npm@11
          registry="https://registry.npmjs.org"
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '%s\n' "@hazeljs:registry=${registry}" "registry=${registry}" > "$npmrc"
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          echo "npm $(npm --version) on node $(node --version)"
          npm view @hazeljs/core version

      - name: Publish packages to NPM
        timeout-minutes: 50
        run: |
          RELEASE_TAG="${{ steps.release-tag.outputs.tag }}"
          echo "Publishing with tag: $RELEASE_TAG via Trusted Publisher (OIDC)"
          export CI=true
          export NPM_CONFIG_YES=true
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          FILTER="${{ github.event.inputs.packages_only }}"
          node scripts/publish-throttled.mjs "$RELEASE_TAG" 5 "$FILTER"

      - name: Update latest dist-tag to current version
        if: steps.release-tag.outputs.tag == 'latest'
        timeout-minutes: 10
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          VERSION="${{ steps.version.outputs.version }}"
          PKGS="core cli ai agent auth cache config cron worker pubsub distributed-lock saga observability inspector casl realtime feature-toggle mcp memory flow flow-runtime prompts i18n typeorm graphql discovery audit oauth kafka gateway guardrails resilience grpc messaging ops-agent data ml rag event-emitter pdf-to-audio prisma queue serverless swagger websocket payment"
          TOTAL=$(echo $PKGS | wc -w)
          echo "Updating latest dist-tag to $VERSION for $TOTAL packages (8 parallel, 60s timeout per package)"
          i=0
          for pkg in $PKGS; do
            i=$((i+1))
            (echo "[$i/$TOTAL] @hazeljs/$pkg" && timeout 60 npm dist-tag add "@hazeljs/$pkg@$VERSION" latest || true) &
            if [ $((i % 8)) -eq 0 ]; then wait; fi
          done
          wait
          echo "Done"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag_name }}"
          version="${{ steps.version.outputs.version }}"
          prerelease="${{ steps.release-tag.outputs.tag != 'latest' }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping"
          else
            args=(release create "$tag" --title "Release $version")
            if [ "$prerelease" = "true" ]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
