name: Publish Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_release:
        description: "Create a full-repo release changeset before publishing"
        required: false
        default: false
        type: boolean
      bump_type:
        description: "Bump type used when full_release=true"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      npm_tag:
        description: "npm dist-tag for publish"
        required: false
        default: latest
        type: choice
        options:
          - latest
          - beta
          - alpha
          - rc

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages in dependency order
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Create full-release changeset (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_release }}
        run: npm run release:full -- ${{ inputs.bump_type }}

      - name: Publish changed packages with Changesets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          npm run version:packages
          npm run publish:packages -- --tag "${{ inputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create/update release PR and publish from main
        if: ${{ github.event_name == 'push' }}
        uses: changesets/action@v1
        with:
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          version: npm run version:packages
          publish: npm run publish:packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
